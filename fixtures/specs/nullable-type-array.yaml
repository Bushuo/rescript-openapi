openapi: 3.1.0
info:
  title: Nullable Type Array API
  version: 1.0.0
paths:
  /profiles:
    post:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProfileRequestBody"
      responses:
        "204":
          description: Saved
components:
  schemas:
    SaveProfileRequestBody:
      type: object
      required:
        - age
      properties:
        age:
          type: ["integer", "null"]
