openapi: 3.1.0
info:
  title: Backend API
  version: 1.0.0
paths:
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Current backend status
          content:
            application/json:
              schema:
                type: string
                enum:
                  - healthy
                  - degraded
components:
  schemas:
    BackendError:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
            message:
              type: string
          required:
            - kind
            - message
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
            status:
              type: integer
          required:
            - kind
            - status
          additionalProperties: false
