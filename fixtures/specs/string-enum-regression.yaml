openapi: 3.1.0
info:
  title: Backend API
  version: 1.0.0
paths:
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Current backend status
          content:
            application/json:
              schema:
                type: string
                enum:
                  - healthy
                  - degraded
